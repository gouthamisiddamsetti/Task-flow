<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Taskflow — Administrator Management Console</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/tokens.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/layout.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <style>
    body[data-page="admin-login"] {
      background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #0f172a 60%, #030712 100%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
      padding: 24px;
      box-sizing: border-box;
    }

    .admin-console-box {
      width: 100%;
      max-width: 460px;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(99, 102, 241, 0.25);
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7), 0 0 40px rgba(99, 102, 241, 0.15);
      position: relative;
      overflow: hidden;
    }

    .admin-console-box::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, #6366f1, #a855f7, #ec4899);
    }

    .admin-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.35);
      color: #a5b4fc;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 4px 12px;
      border-radius: 100px;
      margin-bottom: 16px;
    }

    .admin-badge-dot {
      width: 7px;
      height: 7px;
      background: #38bdf8;
      border-radius: 50%;
      box-shadow: 0 0 10px #38bdf8;
    }

    .admin-header h1 {
      font-size: 24px;
      font-weight: 800;
      margin: 0 0 8px;
      letter-spacing: -0.02em;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .admin-header p {
      font-size: 13.5px;
      color: #94a3b8;
      margin: 0 0 24px;
      line-height: 1.5;
    }

    .credentials-callout {
      background: rgba(30, 41, 59, 0.7);
      border: 1px dashed rgba(148, 163, 184, 0.3);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .cred-info {
      font-size: 12.5px;
      line-height: 1.5;
      color: #cbd5e1;
    }

    .cred-info code {
      font-family: 'JetBrains Mono', monospace;
      background: rgba(15, 23, 42, 0.8);
      padding: 2px 6px;
      border-radius: 4px;
      color: #38bdf8;
      font-size: 12px;
    }

    .btn-autofill {
      background: rgba(99, 102, 241, 0.2);
      border: 1px solid rgba(99, 102, 241, 0.4);
      color: #c7d2fe;
      font-size: 11px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .btn-autofill:hover {
      background: #6366f1;
      color: #ffffff;
      transform: translateY(-1px);
    }

    .form-group-admin {
      margin-bottom: 18px;
    }

    .form-label-admin {
      display: block;
      font-size: 12.5px;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 6px;
    }

    .form-input-admin {
      width: 100%;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 10px;
      padding: 12px 14px;
      color: #ffffff;
      font-size: 14px;
      box-sizing: border-box;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .form-input-admin:focus {
      outline: none;
      border-color: #818cf8;
      background: rgba(15, 23, 42, 0.85);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
    }

    .btn-admin-submit {
      width: 100%;
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      border: none;
      border-radius: 10px;
      padding: 13px;
      color: #ffffff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
      transition: all 0.2s ease;
      margin-top: 8px;
    }

    .btn-admin-submit:hover {
      background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5);
    }

    .btn-admin-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .admin-error {
      color: #f87171;
      font-size: 13px;
      font-weight: 500;
      margin-top: 10px;
      min-height: 18px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #94a3b8;
      font-size: 12.5px;
      text-decoration: none;
      margin-top: 24px;
      transition: color 0.2s;
    }

    .back-link:hover {
      color: #f8fafc;
    }
  </style>
</head>
<body data-page="admin-login">
  <div class="admin-console-box">
    <div class="admin-badge">
      <span class="admin-badge-dot"></span>
      Restricted Management Console
    </div>

    <div class="admin-header">
      <h1>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#818cf8" stroke-width="2.2">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
        Taskflow Admin
      </h1>
      <p>Authenticate with administrative master credentials to unlock privileged engineering workspace access.</p>
    </div>

    <!-- Default Admin Credentials Banner -->
    <div class="credentials-callout">
      <div class="cred-info">
        <div>User: <code>admin@taskflow.local</code></div>
        <div>Pass: <code>Admin@123</code></div>
      </div>
      <button type="button" class="btn-autofill" onclick="autoFillAdmin()">Auto-Fill</button>
    </div>

    <form id="admin-login-form" onsubmit="handleAdminLogin(event)">
      <div class="form-group-admin">
        <label class="form-label-admin" for="admin-email">Administrator Email</label>
        <input type="email" id="admin-email" class="form-input-admin" required placeholder="admin@taskflow.local" autocomplete="username">
      </div>

      <div class="form-group-admin">
        <label class="form-label-admin" for="admin-password">Administrative Password</label>
        <input type="password" id="admin-password" class="form-input-admin" required placeholder="••••••••••••" autocomplete="current-password">
      </div>

      <div id="admin-login-error" class="admin-error"></div>

      <button type="submit" id="btn-admin-login" class="btn-admin-submit">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
        Authorize & Unlock Console
      </button>
    </form>

    <div style="text-align: center;">
      <a href="/login" class="back-link">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        Return to standard employee portal
      </a>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
  <script>
    function autoFillAdmin() {
      document.getElementById('admin-email').value = 'admin@taskflow.local';
      document.getElementById('admin-password').value = 'Admin@123';
      document.getElementById('admin-login-error').textContent = '';
    }

    async function handleAdminLogin(e) {
      e.preventDefault();
      const email = document.getElementById('admin-email').value.trim();
      const password = document.getElementById('admin-password').value;
      const errorEl = document.getElementById('admin-login-error');
      const submitBtn = document.getElementById('btn-admin-login');

      errorEl.textContent = '';
      submitBtn.disabled = true;
      submitBtn.innerHTML = 'Verifying credentials...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || 'Authentication rejected.');
        }

        const user = data.user;
        if (!user.is_admin && user.role !== 'Admin') {
          // Non-admin attempted login on restricted portal
          await fetch('/api/auth/logout', { method: 'POST' });
          throw new Error('Access Denied: This console strictly requires Administrative privileges. Please use standard employee login.');
        }

        submitBtn.innerHTML = 'Access Granted! Redirecting...';
        window.location.href = '/';
      } catch (err) {
        errorEl.textContent = err.message || 'Login failed.';
        submitBtn.disabled = false;
        submitBtn.innerHTML = `
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          Authorize & Unlock Console
        `;
      }
    }
  </script>
</body>
</html>
